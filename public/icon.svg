<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#334155" stroke-width="4" />
  
  <!-- Survivor Shield Badge -->
  <path d="M 256 70 L 390 120 C 390 280 256 390 256 420 C 256 390 122 280 122 120 Z" 
        fill="url(#shieldGrad)" stroke="#34d399" stroke-width="6" />
  
  <!-- Football Silhouette inside Shield -->
  <ellipse cx="256" cy="230" rx="90" ry="54" transform="rotate(-30 256 230)" fill="#78350f" stroke="#fef3c7" stroke-width="4" />
  <!-- Football Laces -->
  <g transform="rotate(-30 256 230)" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="210" y1="230" x2="302" y2="230" />
    <line x1="230" y1="218" x2="230" y2="242" />
    <line x1="256" y1="216" x2="256" y2="244" />
    <line x1="282" y1="218" x2="282" y2="242" />
  </g>

  <!-- Crown / Star Accent for Survivor champion -->
  <polygon points="256,125 268,155 298,155 273,172 282,200 256,183 230,200 239,172 214,155 244,155" fill="url(#goldGrad)" />

  <!-- Checkmark ribbon / Banner for survival -->
  <path d="M 180 340 L 235 385 L 340 285" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
